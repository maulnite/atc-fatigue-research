[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "atc-fatigue-research"
version = "0.1.0.dev0"
description = "Research foundation for audio-visual fatigue detection in air traffic controllers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/maulnite/atc-fatigue-research"
Issues = "https://github.com/maulnite/atc-fatigue-research/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
