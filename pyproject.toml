[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "atc-fatigue-research"
version = "0.1.0.dev0"
description = "Research foundation for audio-visual fatigue detection in air traffic controllers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy==1.26.4", "scipy==1.14.1", "pandas==2.2.3",
    "scikit-learn==1.5.2", "scikit-image==0.24.0", "opensmile==2.6.0",
    "librosa==0.10.2.post1", "soundfile==0.13.1", "pyarrow==19.0.1",
    "matplotlib==3.9.4", "PyYAML==6.0.2", "requests==2.32.3",
    "joblib==1.4.2", "opencv-python-headless==4.11.0.86",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.13", "nbconvert==7.16.6", "ipykernel==6.29.5"]

[project.scripts]
atc-fatigue = "atc_fatigue.cli:main"

[project.urls]
Repository = "https://github.com/maulnite/atc-fatigue-research"
Issues = "https://github.com/maulnite/atc-fatigue-research/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
